# 链路测试配置：复用 blm_clip 的数据，小批量验证数据生产线
# 用法（在 fg_clip/ 目录下）：
#   python -m fg_data.dense_caption --config configs/test_config.yaml --limit 3
#   python -m fg_data.expressions   --config configs/test_config.yaml
#   python -m fg_data.grounding     --config configs/test_config.yaml
#   python -m fg_data.hard_negatives --config configs/test_config.yaml

seed: 42

pipeline:
  image_jsonl: ../blm_clip/data/train.jsonl   # 复用 blm_clip 图文对
  image_root:  ../blm_clip/data/images
  out_dir:     data/fg                        # 各步骤中间产物与最终 fg_train.jsonl
  # Step 1 dense caption
  caption_backend: local
  caption_model: Qwen/Qwen2.5-VL-3B-Instruct
  dashscope_model: qwen-vl-max
  max_new_tokens: 256
  # Step 2 引用表达式
  spacy_model: zh_core_web_sm
  min_expr_per_image: 1
  max_expr_per_image: 6
  # Step 3 grounding
  yolo_model: yolov8s-worldv2.pt
  # 实测：YOLO-World 对带属性的长短语打分系统性偏低（正确框也常只有 0.12~0.25），
  # 方案口径 0.4 会把全部正确框筛掉；链路测试用 0.1，正式跑量建议按数据校准 0.1~0.25
  conf_threshold: 0.1
  nms_iou: 0.5
  translate_to_en: true                        # YOLO-World 文本编码器为英文 CLIP，中文需先翻译
  translate_model: Helsinki-NLP/opus-mt-zh-en
  # Step 4 难负例
  hard_neg_per_expr: 2
  hard_neg_backend: llm                        # llm（大模型改写+校验）| rule（词表兜底）
  hard_neg_model: Qwen/Qwen2.5-VL-3B-Instruct  # 复用 dense caption 的模型权重
