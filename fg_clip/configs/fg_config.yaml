# ============================================================
# 细粒度图文对齐（FG-CLIP 式）配置
# 数据生产线 + 区域损失训练，复用 blm_clip 基座
# ============================================================

seed: 42

# ---------- 数据生产线 ----------
pipeline:
  image_jsonl: data/train.jsonl          # 输入：图文对（复用 blm_clip 数据）
  image_root:  data/images
  out_dir:     data/fg                   # 各步骤中间产物与最终 fg_train.jsonl
  # Step 1 dense caption
  caption_backend: local                 # local（Qwen2.5-VL 本地）| dashscope（API）
  caption_model: Qwen/Qwen2.5-VL-3B-Instruct
  dashscope_model: qwen-vl-max
  max_new_tokens: 256
  # Step 2 引用表达式
  spacy_model: zh_core_web_sm            # python -m spacy download zh_core_web_sm
  min_expr_per_image: 1
  max_expr_per_image: 6
  # Step 3 grounding
  yolo_model: yolov8s-worldv2.pt         # 首次自动下载
  conf_threshold: 0.4                    # 方案口径：只保留置信度 > 0.4 的框
  nms_iou: 0.5
  # Step 4 难负例
  hard_neg_per_expr: 2                   # 每个正例表达式生成 1~3 个难负例

# ---------- 训练 ----------
model:
  base_ckpt: null                        # 可指向 blm_clip 的 ckpt（继续训练）；null=从头
  vision_type: qwenvit
  vision_name: Qwen/Qwen2.5-VL-3B-Instruct
  timm_name: vit_base_patch16_224.augreg_in21k
  text_tokenizer: Qwen/Qwen2.5-0.5B
  text_width: 512
  text_layers: 12
  text_heads: 8
  text_max_len: 96
  embed_dim: 768
  init_logit_scale: 0.07
  max_logit_scale: 100.0
  freeze_vision: false

data:
  fg_train_jsonl: data/fg/fg_train.jsonl
  eval_jsonl: data/eval.jsonl
  image_root: data/images
  min_pixels: 100352
  max_pixels: 351232
  patch_size: 14
  merge_size: 2
  num_workers: 4

train:
  output_dir: outputs/fg_v1
  batch_size: 16
  max_regions_per_image: 4               # 每图采样区域数上限（控制文本塔开销）
  accum_steps: 4
  lr_vision: 1.0e-5
  lr_text: 5.0e-5
  lr_proj: 5.0e-5
  weight_decay: 0.2
  betas: [0.9, 0.98]
  eps: 1.0e-6
  warmup_steps: 300
  max_steps: 5000
  grad_clip: 1.0
  bf16: true
  # 三损失权重（方案 5.1~5.3）：L = L_global + λ1*L_region + λ2*L_hard
  lambda_region: 0.5
  lambda_hard: 1.0
  hard_margin: 0.2
  log_every: 20
  eval_every: 500
  save_every: 1000
  max_checkpoints: 3
